<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console — onagent</title>

    <!-- Google tag (gtag.js): loads once per page, site-wide, recording a
         page_view on every load — the registration conversion event fires
         separately from application code (see src/analytics.ts). Skipped
         entirely when VITE_DISABLE_ANALYTICS=true (see .env.example) so
         local testing never sends page views either, not just conversions.
         type="module" so Vite processes import.meta.env here like any
         other module — a plain inline script wouldn't get it rewritten. -->
    <script type="module">
      if (import.meta.env.VITE_DISABLE_ANALYTICS !== 'true') {
        const s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18416841975'
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        window.gtag = function () { window.dataLayer.push(arguments) }
        window.gtag('js', new Date())
        window.gtag('config', 'AW-18416841975')
        window.gtag('config', 'G-MP4CK0P8JF')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
