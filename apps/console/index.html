<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to
         resolve to anything other than 0 on iOS — without it Safari
         letterboxes the page around notches/the home indicator instead
         of extending under them, so every safe-area calc() in this app's
         mobile CSS (MobileTopBar/MobileBottomBar/BottomSheet/App.module.css)
         was previously a no-op.

         interactive-widget=resizes-content tells the browser to shrink the
         layout viewport itself when the on-screen keyboard opens, instead
         of leaving it full-height with the keyboard just overlaid on top.
         Without it, every fullscreen BottomSheet (position:fixed; inset:0)
         keeps its pre-keyboard height, so a focused input near the bottom
         of one (ToolNameSheet/ToolDescriptionSheet, both full-screen with
         little else above the field) ends up covered by the keyboard —
         the browser's own "scroll the focused input into view" heuristic
         has nothing to scroll, since nothing about the fixed panel's own
         geometry changed from its perspective. Supported by current
         Chrome/Android WebView and Safari; unsupported browsers just
         ignore this token and keep the old (keyboard-overlays) behavior. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Console — onagent</title>

    <!-- Same icon set the landing pages use. The console is served at /app
         (see backend/cmd/server/web.go's mountConsole) from the same origin
         as the landing build at / (mountLanding), so these resolve to
         apps/landing/public/'s files without the console needing a public/
         directory of its own.

         Root-absolute on purpose: vite.config.ts sets base:'/app/', which
         would rewrite a relative href to /app/favicon.svg — a path that
         doesn't exist. A leading slash is left alone by that rewrite.

         Dev-server caveat: `npm run dev` on :5173 serves only this app, so
         these 404 locally and the tab shows Vite's default icon. They
         resolve in the Docker image, where both builds sit behind one
         origin. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Tag Manager: loads the onagent container (GTM-MXMK83XR),
         which owns the GA4 tag, the Ads tag, and the Ads registration
         conversion tag — none of that config lives in this repo anymore,
         see marketing/gtm-tools/README.md to inspect or change it.
         Skipped entirely when VITE_DISABLE_ANALYTICS=true (see
         .env.example) so local testing never sends page views or events.
         type="module" so Vite processes import.meta.env here like any
         other module — a plain inline script wouldn't get it rewritten. -->
    <script type="module">
      if (import.meta.env.VITE_DISABLE_ANALYTICS !== 'true') {
        window.dataLayer = window.dataLayer || []
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        const s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MXMK83XR'
        document.head.appendChild(s)
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MXMK83XR"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
