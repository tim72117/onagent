<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to
         resolve to anything other than 0 on iOS — without it Safari
         letterboxes the page around notches/the home indicator instead
         of extending under them, so every safe-area calc() in this app's
         mobile CSS (MobileTopBar/MobileBottomBar/BottomSheet/App.module.css)
         was previously a no-op. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Console — onagent</title>

    <!-- Google Tag Manager: loads the onagent container (GTM-MXMK83XR),
         which owns the GA4 tag, the Ads tag, and the Ads registration
         conversion tag — none of that config lives in this repo anymore,
         see marketing/gtm-tools/README.md to inspect or change it.
         Skipped entirely when VITE_DISABLE_ANALYTICS=true (see
         .env.example) so local testing never sends page views or events.
         type="module" so Vite processes import.meta.env here like any
         other module — a plain inline script wouldn't get it rewritten. -->
    <script type="module">
      if (import.meta.env.VITE_DISABLE_ANALYTICS !== 'true') {
        window.dataLayer = window.dataLayer || []
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        const s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MXMK83XR'
        document.head.appendChild(s)
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MXMK83XR"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
