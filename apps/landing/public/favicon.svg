<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Halo Swell Amber — an eccentric-circle ring (outer circle minus an
       off-center inner circle, evenodd fill), so the band width varies
       continuously around the circumference instead of a uniform stroke.
       This is the "even" favicon-only variant, not the site's full-strength
       brand mark used in index.html's .brand/.foot-brand: solid #c9a24b (no
       gradient) and a smaller eccentricity, because at 16px the full
       gradient version's thinnest edge drops under 1.2px and, worse, its
       lightest gradient stop lands on that same thin edge — against a white
       or light-grey browser tab strip that combination measures under 2:1
       contrast and the ring reads as a broken "C", not a full "O". Solid
       #c9a24b against white is still only ~2.4:1, which is why this asset
       stays favicon-only — the full gradient mark is for ≥48px contexts on
       the site's own #0d0b07 ground, where contrast is 7:1+ and the extra
       eccentricity reads clearly. -->
  <path fill="#c9a24b" fill-rule="evenodd" d="
    M 8 50 a 42 42 0 1 0 84 0 a 42 42 0 1 0 -84 0 Z
    M 26 48 a 26 26 0 1 0 52 0 a 26 26 0 1 0 -52 0 Z" />
</svg>
