name: Release @onagent/claude-skill

# Manual-only on purpose, same reasoning as release-bridge-sdk.yml:
# publishing to npm is a one-way action (a version can be unpublished but
# not reused), so this never fires automatically off a tag push. Bump
# packages/claude-skill/package.json's version in a normal commit first,
# then run this by hand when you're ready to publish that version.
on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) — lets this job request a
      # short-lived identity token from GitHub that npm verifies against the
      # Trusted Publisher config on @onagent/claude-skill's npm page (repo +
      # this exact workflow filename). No NPM_TOKEN secret needed as a
      # result, and nothing long-lived to leak.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No Go build step here anymore — this package no longer bundles any
      # onagent binary. cli.js downloads the latest one from this repo's
      # GitHub Releases (release-onagent.yml) at install time instead, so
      # a user always gets whatever's newest there, independent of when
      # this npm package itself was last published.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to a Trusted-Publishing-capable version
        run: npm install -g npm@latest

      - name: Check version isn't already published
        working-directory: packages/claude-skill
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          if npm view "@onagent/claude-skill@$version" version >/dev/null 2>&1; then
            echo "::error::@onagent/claude-skill@$version is already on npm — bump package.json's version first."
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/claude-skill
        # No NODE_AUTH_TOKEN — npm detects the OIDC id-token permission above
        # and authenticates via Trusted Publishing instead. Requires the
        # Trusted Publisher config on npmjs.com/package/@onagent/claude-skill
        # to list this exact repo + workflow filename.
        run: npm publish --access public

      - name: Show published version
        run: |
          echo "### 已發布" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "npx -p @onagent/claude-skill@${{ env.version }} claude-skill-onagent" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
