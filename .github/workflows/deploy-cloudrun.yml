name: Deploy to Cloud Run

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_build:
        description: '只部署不重新 build（使用現有 latest image）'
        type: boolean
        default: false

env:
  # TODO: 這是 placeholder,請換成使用者實際建立的 GCP 專案 ID(見 deploy/setup.sh)。
  GCP_PROJECT_ID: "onagent-prod"
  CLOUD_RUN_SERVICE: "onagent-server"
  CLOUD_RUN_REGION: "asia-east1"
  IMAGE: "asia-east1-docker.pkg.dev/onagent-prod/cloud-run-source-deploy/onagent-server"

jobs:
  # 只在需要重新 build 時才跑：push tag 一律 build；workflow_dispatch 則看
  # skip_build 輸入。deploy job 用 needs: build 的 if: always() +
  # result != 'failure' 讓「build 被整個跳過」跟「build 執行完成」都能繼續往
  # 下走，只有「build 真的失敗」才會連帶擋下 deploy。
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: "1"
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # --secret (not --build-arg) so GH_PAT never lands in the image's
          # layer history — it only exists as a file during the one RUN
          # step in the Dockerfile that reads it.
          docker build \
            --secret id=gh_pat,env=GH_PAT \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    # build 被 if 條件整個跳過時，needs.build.result 是 "skipped"，不是
    # "success" —— 預設的隱含 if（needs 全部成功）會因此連帶跳過 deploy，
    # 這正是 skip_build=true 時「build 不跑但 deploy 要繼續」需要的行為，
    # 所以這裡明確允許 success 或 skipped 通過，只有 build 真的失敗
    # (failure/cancelled) 才擋下 deploy。
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        env:
          # skip_build reuses whatever :latest already points to — there's
          # no fresh :${{ github.sha }} image for this run since the build
          # job didn't run.
          DEPLOY_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_build == true) && 'latest' || github.sha }}
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image=${{ env.IMAGE }}:${{ env.DEPLOY_TAG }} \
            --region=${{ env.CLOUD_RUN_REGION }} \
            --update-env-vars=APP_ENV=production,COOKIE_SECURE=true,AI_PROVIDER=googleapis,AI_MODEL=gemini-2.5-flash-lite,ALLOWED_ORIGIN=https://onagent.shuttle.tools,APP_ORIGINS=https://agent.shuttle.tools,GOOGLE_OAUTH_REDIRECT_URL=https://onagent.shuttle.tools/auth/google/callback \
            --update-secrets=DATABASE_URL=DATABASE_URL:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,ADMIN_BOOTSTRAP_EMAIL=ADMIN_BOOTSTRAP_EMAIL:latest,ADMIN_BOOTSTRAP_PASSWORD=ADMIN_BOOTSTRAP_PASSWORD:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest \
            --quiet

      - name: Show Cloud Run URL
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --format 'value(status.url)')
          echo "### 部署完成" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
