name: Release @onagent/bridge SDK

# Manual-only on purpose: publishing to npm is a one-way action (a version
# can be unpublished but not reused), so this never fires automatically off
# a tag push the way deploy-cloudrun.yml/release-onagent.yml do. Bump
# packages/bridge/package.json's version in a normal commit first, then run
# this by hand when you're ready to publish that version.
on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bridge
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) — lets this job request a
      # short-lived identity token from GitHub that npm verifies against the
      # Trusted Publisher config on @onagent/bridge's npm page (repo + this
      # exact workflow filename). No NPM_TOKEN secret needed as a result,
      # and nothing long-lived to leak.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Update npm to a Trusted-Publishing-capable version
        run: npm install -g npm@latest

      - name: Check version isn't already published
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          if npm view "@onagent/bridge@$version" version >/dev/null 2>&1; then
            echo "::error::@onagent/bridge@$version is already on npm — bump package.json's version first."
            exit 1
          fi

      - name: Publish to npm
        # No NODE_AUTH_TOKEN — npm detects the OIDC id-token permission above
        # and authenticates via Trusted Publishing instead. Requires the
        # Trusted Publisher config on npmjs.com/package/@onagent/bridge to
        # list this exact repo + workflow filename.
        run: npm publish --access public

      - name: Show published version
        run: |
          echo "### 已發布" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "npm install @onagent/bridge@${{ env.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
