name: Release public Docker image

# Same "v*" tag push as deploy-cloudrun.yml / release-onagent.yml,
# triggered independently and in parallel with them — no cross-workflow
# dependency. An earlier version of this file tried to trigger off "a
# GitHub Release gets published" instead, on the theory that publishing a
# Release is a more deliberate signal than a tag push; in practice the
# Release release-onagent.yml creates is itself just an automatic result
# of the same tag push (no human review step in between), so it added an
# extra hop with no real gain — and GitHub Actions doesn't chain-trigger
# workflows off events caused by the default GITHUB_TOKEN anyway, which
# silently broke it for v0.2.1. The one genuinely deliberate moment in
# this whole pipeline is the tag push itself, so react to that directly.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.2.0). Defaults to the short commit SHA.'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/onagent-server-release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          DOCKER_BUILDKIT: "1"
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          docker build \
            -f Dockerfile.release \
            --secret id=gh_pat,env=GH_PAT \
            -t ${{ env.IMAGE }}:${{ steps.tag.outputs.value }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          docker push ${{ env.IMAGE }}:latest

      - name: Show pull command
        run: |
          echo "### 已發布" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "**第一次發布後記得手動把這個 package 的可見度改成 Public**（GitHub repo → Packages → onagent-server-release → Package settings → Danger Zone），預設是 private。" >> "$GITHUB_STEP_SUMMARY"
